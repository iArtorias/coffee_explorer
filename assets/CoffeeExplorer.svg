<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Coffee Explorer</title>
  <defs>
    <linearGradient id="mug" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A5A34"/>
      <stop offset="0.55" stop-color="#6F4426"/>
      <stop offset="1" stop-color="#55331C"/>
    </linearGradient>
    <linearGradient id="coffee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2414"/>
      <stop offset="1" stop-color="#2A190D"/>
    </linearGradient>
  </defs>
  <!-- Steam: three wisps in the Visual Studio accent blue -->
  <g fill="none" stroke="#3B9AE8" stroke-width="12" stroke-linecap="round">
    <path d="M86 70 C74 56 98 46 86 30"/>
    <path d="M122 70 C110 52 136 40 122 18"/>
    <path d="M158 70 C146 56 170 46 158 30"/>
  </g>
  <!-- Saucer -->
  <ellipse cx="122" cy="224" rx="98" ry="16" fill="#4A2C17"/>
  <!-- Handle -->
  <path d="M184 112 h14 a30 30 0 0 1 0 60 h-14" fill="none" stroke="#5E3A20" stroke-width="16" stroke-linejoin="round"/>
  <!-- Mug body -->
  <path d="M48 92 h148 v84 a40 40 0 0 1 -40 40 h-68 a40 40 0 0 1 -40 -40 z" fill="url(#mug)"/>
  <!-- Rim and coffee surface -->
  <rect x="44" y="84" width="156" height="16" rx="8" fill="#9C6B42"/>
  <rect x="54" y="88" width="136" height="8" rx="4" fill="url(#coffee)"/>
  <!-- Byte grid: the file inside -->
  <g fill="#F4E6D2">
    <rect x="78" y="120" width="22" height="22" rx="4"/>
    <rect x="111" y="120" width="22" height="22" rx="4" fill-opacity="0.45"/>
    <rect x="144" y="120" width="22" height="22" rx="4"/>
    <rect x="78" y="153" width="22" height="22" rx="4" fill-opacity="0.45"/>
    <rect x="111" y="153" width="22" height="22" rx="4"/>
    <rect x="144" y="153" width="22" height="22" rx="4" fill-opacity="0.45"/>
  </g>
</svg>
